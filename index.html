<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-platform="win">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Hub · 跨平台 SKILL 管理器</title>
<link rel="stylesheet" href="assets/styles/tokens.css">
<link rel="stylesheet" href="assets/styles/layout.css">
<link rel="stylesheet" href="assets/styles/components.css">
<link rel="stylesheet" href="assets/styles/dialogs.css">
<link rel="stylesheet" href="assets/styles/editor.css">
</head>
<body>
<div class="app" id="app">
  <!-- 标题栏 -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar__lights" id="macLights" hidden>
      <button class="light light--close" data-win="close" title="关闭"></button>
      <button class="light light--min" data-win="min" title="最小化"></button>
      <button class="light light--max" data-win="max" title="最大化"></button>
    </div>

    <div class="titlebar__brand" data-tauri-drag-region>
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="3" width="16" height="14" rx="3" fill="#6BA8A0"/>
          <path d="M6 7h8M6 10h8M6 13h5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">Skill Hub</span>
      <span class="brand-version">v0.9</span>
    </div>

    <div class="titlebar__drag" aria-hidden="true" data-tauri-drag-region></div>

    <div class="titlebar__controls" id="winControls">
      <button class="win-btn" data-win="min" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="win-btn" data-win="max" title="最大化">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="win-btn win-btn--close" data-win="close" title="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__top">
        <div class="searchbox" id="searchBox">
          <svg class="searchbox__icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.3"/>
            <path d="M9.2 9.2L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="text" placeholder="搜索 SKILL" autocomplete="off" spellcheck="false">
          <kbd class="kbd" id="searchKbd">Ctrl K</kbd>
        </div>
      </div>

      <nav class="sidebar__nav" id="sidebarNav"><!-- JS 渲染 --></nav>

      <div class="sidebar__spacer"></div>

      <div class="sidebar__footer">
        <button class="nav-cta" id="newSkillBtn" style="margin-bottom:8px">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span>新建 SKILL</span>
        </button>
        <div class="sync-row">
          <span class="dot dot--live"></span>
          <span id="syncText">已同步 6 个目录 · 刚刚</span>
        </div>
        <button class="settings-row" id="trashBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2.6 3.8h8.8M5 3.8V2.6h4v1.2M3.6 3.8l.6 7.4h5.6l.6-7.4M5.8 6v3.4M8.2 6v3.4"
                  stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>回收站</span>
        </button>
        <button class="settings-row" id="settingsBtn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="2.2" stroke="currentColor" stroke-width="1.2"/>
            <path d="M7 1.5v1.4M7 11.1v1.4M1.5 7h1.4M11.1 7h1.4M3.1 3.1l1 1M9.9 9.9l1 1M10.9 3.1l-1 1M4.1 9.9l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          <span>设置与偏好</span>
        </button>
      </div>
    </aside>

    <div class="vline"></div>

    <!-- 内容区 -->
    <main class="content">
      <div class="content__header">
        <div class="content__title-group">
          <div class="content__title-row">
            <h1 id="pageTitle">全部技能</h1>
            <span class="badge badge--mono" id="pageCount">0</span>
          </div>
          <p class="content__subtitle" id="pageSubtitle">来自 6 个来源 · 按分类浏览</p>
        </div>

        <div class="content__actions">
          <div class="menu-wrap" id="sortWrap">
            <button class="btn btn--outline btn--sort" id="sortBtn" aria-haspopup="menu" aria-expanded="false">
              <span id="sortLabel">最近更新</span>
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="menu" id="sortMenu" role="menu" hidden>
              <button class="menu__item" data-sort="updated" role="menuitem">最近更新</button>
              <button class="menu__item" data-sort="name" role="menuitem">名称 A → Z</button>
              <button class="menu__item" data-sort="source" role="menuitem">按来源分组</button>
              <button class="menu__item" data-sort="created" role="menuitem">最近导入</button>
            </div>
          </div>

          <div class="segmented segmented--view" id="viewToggle" role="tablist" aria-label="视图切换">
            <button class="segmented__btn is-active" data-view="grid" role="tab" aria-selected="true" title="网格视图">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="2" y="2" width="4" height="4" rx="1" fill="currentColor"/>
                <rect x="8" y="2" width="4" height="4" rx="1" fill="currentColor"/>
                <rect x="2" y="8" width="4" height="4" rx="1" fill="currentColor"/>
                <rect x="8" y="8" width="4" height="4" rx="1" fill="currentColor"/>
              </svg>
            </button>
            <button class="segmented__btn" data-view="list" role="tab" aria-selected="false" title="列表视图">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
            </button>
          </div>

          <button class="btn btn--outline" id="importBtn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2.5 8.5h9v3a1 1 0 01-1 1h-7a1 1 0 01-1-1v-3z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
              <path d="M7 2v5M4.8 5.2L7 7.4l2.2-2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>导入 SKILL</span>
          </button>

          <button class="btn btn--primary" id="exportSelectedBtn" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 2v7M4.2 6.2L7 9l2.8-2.8M2.5 11.5h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>导出所选</span>
          </button>
        </div>
      </div>

      <div class="filterbar">
        <div class="chips" id="filterChips">
          <button class="chip is-active" data-filter="all">全部</button>
          <button class="chip" data-filter="favorite">已收藏</button>
          <button class="chip" data-filter="recent">最近 7 天更新</button>
          <button class="chip" data-filter="exportable">可导出</button>
        </div>
        <div class="filterbar__spacer"></div>
        <span class="filterbar__count" id="resultCount">共 0 个 SKILL</span>
      </div>
      <div class="hline"></div>

      <div class="content__scroll" id="listScroll" tabindex="0"></div>

      <div class="selection-bar" id="selectionBar" hidden>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="16" height="16" rx="4" stroke="#6BA8A0" stroke-width="1.4"/>
          <path d="M5 9l2.5 2.5L13 6.5" stroke="#8FC4BC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="selection-bar__count" id="selectionCount">已选 0 个 SKILL</span>
        <div class="selection-bar__spacer"></div>
        <button class="selection-bar__clear" id="clearSelectionBtn">清空选择</button>
        <button class="btn btn--accent btn--sm" id="selectionExportBtn">导出打包</button>
        <button class="btn btn--danger-text btn--sm" id="selectionDeleteBtn" disabled
                title="先勾选要删除的 SKILL">批量删除</button>
      </div>
    </main>

    <div class="vline"></div>

    <!-- 详情 -->
    <aside class="inspector" id="inspector"></aside>
  </div>

  <footer class="statusbar">
    <span id="statusText">本地索引 · 0 个 SKILL · 6 个来源</span>
    <div class="statusbar__spacer"></div>
    <button class="statusbar__hint" id="rescanBtn"><span id="rescanHint">Ctrl R</span> 重新扫描</button>
  </footer>
</div>

<div id="overlayRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="src/core/utils.js"></script>
<script src="src/core/native.js"></script>
<script src="src/core/seed.js"></script>
<script src="src/core/markdown.js"></script>
<script src="src/core/metaFormats.js"></script>
<script src="src/core/zip.js"></script>
<script src="src/core/store.js"></script>
<script src="src/core/importExport.js"></script>
<script src="src/ui/icons.js"></script>
<script src="src/ui/components.js"></script>
<script src="src/ui/sidebar.js"></script>
<script src="src/ui/list.js"></script>
<script src="src/ui/detail.js"></script>
<script src="src/ui/editor.js"></script>
<script src="src/ui/trash.js"></script>
<script src="src/ui/dialogs.js"></script>
<script src="src/app.js"></script>
</body>
</html>
